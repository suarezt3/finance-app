<!-- src/app/features/dashboard/summary/summary.component.html -->
<div class="summary-container">

  <!-- CABECERA -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
    <div>
      <h2 style="margin: 0; color: #262626;">Resumen Financiero</h2>
      <p style="color: #8c8c8c; margin-top: 4px;">Última actualización: {{ summary().lastUpdated | date:'mediumTime' }}</p>
    </div>

    <button nz-button nzType="primary" nzSize="large" (click)="openModal()">
      <span nz-icon nzType="plus"></span>
      Nueva Transacción
    </button>
  </div>

  <!-- TARJETAS DE KPIs (Métricas Principales) -->
  <nz-row [nzGutter]="[16, 16]">
    <nz-col [nzXs]="24" [nzSm]="8">
      <nz-card nzHoverable class="kpi-card balance-card">
        <nz-statistic
          [nzValue]="(summary().totalBalance | number:'1.0-2':'es') || '0'"
          [nzTitle]="'Saldo Total'"
          nzPrefix="$"
        ></nz-statistic>
      </nz-card>
    </nz-col>

    <nz-col [nzXs]="24" [nzSm]="8">
      <nz-card nzHoverable class="kpi-card income-card">
        <nz-statistic
          [nzValue]="(summary().totalIncome | number:'1.0-2':'es') || '0'"
          [nzTitle]="'Ingresos Totales'"
          nzPrefix="$"
          [nzValueStyle]="{ color: '#3f8600' }"
          [nzPrefix]="iconIncome"
        ></nz-statistic>
        <ng-template #iconIncome><span nz-icon nzType="arrow-up"></span> $ </ng-template>
      </nz-card>
    </nz-col>

    <nz-col [nzXs]="24" [nzSm]="8">
      <nz-card nzHoverable class="kpi-card expense-card">
        <nz-statistic
          [nzValue]="(summary().totalExpenses | number:'1.0-2':'es') || '0'"
          [nzTitle]="'Gastos Totales'"
          nzPrefix="$"
          [nzValueStyle]="{ color: '#cf1322' }"
          [nzPrefix]="iconExpense"
        ></nz-statistic>
        <ng-template #iconExpense><span nz-icon nzType="arrow-down"></span> $ </ng-template>
      </nz-card>
    </nz-col>
  </nz-row>

  <!-- ÁREA DE GRÁFICOS (Implementación con @defer para rendimiento) -->
  <div style="margin-top: 24px;">
    <nz-card nzTitle="Evolución del Balance" [nzBordered]="false">
      @defer (when balanceChartOptions() !== null) {
        @if (balanceChartOptions(); as options) {
          <div echarts [options]="options" class="chart-container"></div>
        } @else {
          <div class="empty-chart">
            <span nz-icon nzType="line-chart" style="font-size: 32px; color: #d9d9d9;"></span>
            <p style="color: #8c8c8c; margin-top: 16px;">No hay datos suficientes para graficar.</p>
          </div>
        }
      } @placeholder {
        <div class="chart-skeleton">Cargando motor gráfico...</div>
      }
    </nz-card>
  </div>

  <!-- INTEGRACIÓN DEL MODAL COMPARTIDO -->
  <!-- Como el Summary solo "Crea", no le pasamos el input [transactionToEdit] -->
  <app-transaction-modal
    [isVisible]="isModalVisible()"
    (closeModal)="closeModal()"
    (transactionSaved)="onTransactionSaved()">
  </app-transaction-modal>

</div>
