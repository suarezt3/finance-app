<!-- src/app/features/dashboard/summary/summary.component.html -->
<div class="summary-container">
  <nz-row [nzGutter]="16">
    <!-- Tarjeta de Saldo Total -->
    <nz-col nzSpan="8">
      <nz-card>
        <nz-statistic [nzValue]="summary().totalBalance" [nzTitle]="'Saldo Total'" nzPrefix="$"></nz-statistic>
      </nz-card>
    </nz-col>

    <!-- Tarjeta de Ingresos -->
    <nz-col nzSpan="8">
      <nz-card>
        <nz-statistic [nzValue]="summary().totalIncome" [nzTitle]="'Ingresos'" nzPrefix="$" [nzValueStyle]="{ color: '#3f8600' }"></nz-statistic>
      </nz-card>
    </nz-col>

    <!-- Tarjeta de Gastos -->
    <nz-col nzSpan="8">
      <nz-card>
        <nz-statistic [nzValue]="summary().totalExpenses" [nzTitle]="'Gastos'" nzPrefix="$" [nzValueStyle]="{ color: '#cf1322' }"></nz-statistic>
      </nz-card>
    </nz-col>
  </nz-row>
  <!-- SECCIÓN DEL GRÁFICO CON @defer -->
  <div class="chart-section" style="margin-top: 24px;">
    <nz-card nzTitle="Evolución del Saldo (Últimos 7 días)">

      <!-- Magia de Angular: Carga Diferida -->
     @defer (on viewport) {

        <!-- Usamos 'as options' para inferir el tipo estricto excluyendo null -->
        @if (balanceChartOptions(); as options) {
          <div echarts [options]="options" style="height: 350px;"></div>
        }

      } @placeholder {

        <!-- UI Placeholder inmediato y de bajo costo -->
        <div style="height: 350px; display: flex; justify-content: center; align-items: center; background-color: #fafafa; border-radius: 4px;">
          <span style="color: #8c8c8c;">Preparando gráfico interactivo...</span>
        </div>

      }
    </nz-card>
  </div>
</div>
