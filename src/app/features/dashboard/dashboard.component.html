<!-- src/app/features/dashboard/dashboard.component.html -->
<nz-layout class="app-layout">

  <!-- BARRA LATERAL (Sidebar) -->
  <nz-sider
    class="menu-sidebar"
    nzCollapsible
    nzWidth="256px"
    nzBreakpoint="md"
    [nzCollapsed]="isCollapsed()"
    (nzCollapsedChange)="isCollapsed.set($event)"
    [nzTrigger]="null">

    <div class="sidebar-logo">
      <h1>{{ isCollapsed() ? 'FA' : 'FinanceApp' }}</h1>
    </div>

    <!-- Menú de navegación principal -->
    <ul nz-menu nzTheme="dark" nzMode="inline" [nzInlineCollapsed]="isCollapsed()">
      <li nz-submenu nzOpen nzTitle="Panel Principal" nzIcon="dashboard">
        <ul>
          <li nz-menu-item nzMatchRouter>
            <a>Resumen Financiero</a>
          </li>
          <li nz-menu-item nzMatchRouter>
            <a>Transacciones</a>
          </li>
        </ul>
      </li>
      <li nz-menu-item nzMatchRouter>
        <span nz-icon nzType="setting"></span>
        <span>Configuración</span>
      </li>
    </ul>
  </nz-sider>

  <!-- CONTENEDOR PRINCIPAL -->
  <nz-layout>

    <!-- CABECERA (Header) -->
    <nz-header>
      <div class="app-header">
        <!-- Botón para colapsar/expandir menú -->
        <span class="header-trigger" (click)="toggleSidebar()">
          <span nz-icon [nzType]="isCollapsed() ? 'menu-unfold' : 'menu-fold'"></span>
        </span>

        <!-- Acciones de usuario -->
        <div class="header-actions">
          <button nz-button nzType="text" nzDanger (click)="onLogout()">
            <span nz-icon nzType="logout"></span>
            Cerrar Sesión
          </button>
        </div>
      </div>
    </nz-header>

    <!-- ÁREA DE TRABAJO (Content) -->
    <nz-content>
      <div class="inner-content">
        <!--
          Aquí inyectaremos mediante rutas hijas los componentes
          pesados (gráficos, tablas) usando @defer más adelante.
        -->
        <h3>Área de trabajo preparada</h3>
        <router-outlet></router-outlet>
      </div>
    </nz-content>

  </nz-layout>
</nz-layout>
