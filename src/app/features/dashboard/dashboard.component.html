<!-- src/app/features/dashboard/dashboard.component.html -->

<!-- 1. TEMPLATE DEL MENÚ (Ahora recibe una variable 'prefix') -->
<ng-template #menuItemsTemplate let-prefix="prefix">
  <ul nz-menu nzTheme="dark" nzMode="inline" [nzInlineCollapsed]="isDesktopCollapsed()">

    <li nz-submenu nzOpen nzTitle="Panel Principal" nzIcon="dashboard">
      <ul>
        <!-- Generación dinámica de ID para evitar duplicidad en el DOM -->
        <li nz-menu-item nzMatchRouter (click)="closeMobileMenu()" [id]="prefix + '-resumen'">
          <a routerLink="/dashboard/resumen">Resumen Financiero</a>
        </li>
        <li nz-menu-item nzMatchRouter (click)="closeMobileMenu()" [id]="prefix + '-transacciones'">
          <a routerLink="/dashboard/transacciones">Transacciones</a>
        </li>
      </ul>
    </li>

    <li nz-menu-item nzMatchRouter (click)="closeMobileMenu()" [id]="prefix + '-config'">
      <a routerLink="/dashboard/configuracion">
        <span nz-icon nzType="setting"></span>
        <span>Configuración</span>
      </a>
    </li>
  </ul>
</ng-template>

<nz-layout class="app-layout">

  <!-- 2. SIDEBAR DESKTOP -->
  <nz-sider
    class="desktop-sidebar"
    nzCollapsible
    nzWidth="256px"
    [nzCollapsed]="isDesktopCollapsed()"
    (nzCollapsedChange)="isDesktopCollapsed.set($event)"
    [nzTrigger]="null">

    <div class="sidebar-logo">
      <h1>{{ isDesktopCollapsed() ? 'FA' : 'FinanceApp' }}</h1>
    </div>

    <!-- Renderizamos la plantilla pasando el prefijo 'desktop' -->
    <ng-container *ngTemplateOutlet="menuItemsTemplate; context: { prefix: 'desktop' }"></ng-container>
  </nz-sider>

  <!-- 3. DRAWER MÓVIL -->
  <nz-drawer
    [nzVisible]="isMobileMenuOpen()"
    nzPlacement="left"
    nzTitle="FinanceApp"
    (nzOnClose)="closeMobileMenu()"
    class="mobile-drawer"
    [nzClosable]="true"
    [nzBodyStyle]="{ padding: '0' }">
    <ng-container *nzDrawerContent>
      <!-- Renderizamos la plantilla pasando el prefijo 'mobile' -->
      <ng-container *ngTemplateOutlet="menuItemsTemplate; context: { prefix: 'mobile' }"></ng-container>
    </ng-container>
  </nz-drawer>

  <!-- 4. CONTENEDOR PRINCIPAL -->
  <nz-layout>
    <nz-header>
      <div class="app-header">

        <!-- FIX: Añadimos el ID 'tour-hamburger-btn' para que Driver.js pueda anclarse en móvil -->
        <span class="header-trigger" (click)="toggleMenu()" id="tour-hamburger-btn">
          <span nz-icon [nzType]="getMenuIcon()"></span>
        </span>

        <div class="header-actions">
          @if (user()) {
            <!-- Este elemento no está en un template duplicado, su ID fijo está bien -->
            <a nz-dropdown [nzDropdownMenu]="userMenu" class="user-dropdown" id="tour-user-menu">
              <nz-avatar
                [nzText]="userInitial()"
                nzSize="default"
                style="background-color: #1890ff;">
              </nz-avatar>
              <span class="user-name hide-on-mobile">{{ userName() }}</span>
              <span nz-icon nzType="down"></span>
            </a>

            <nz-dropdown-menu #userMenu="nzDropdownMenu">
              <ul nz-menu>
                <li nz-menu-item (click)="openProfile()">
                  <span nz-icon nzType="user"></span> Mi Perfil
                </li>
                <li nz-menu-divider></li>
                <li nz-menu-item nzDanger (click)="onLogout()">
                  <span nz-icon nzType="logout"></span> Cerrar Sesión
                </li>
              </ul>
            </nz-dropdown-menu>
          }
        </div>
      </div>
    </nz-header>

    <nz-content>
      <div class="inner-content">
        <router-outlet></router-outlet>
      </div>
    </nz-content>
  </nz-layout>

  <app-profile-modal></app-profile-modal>
</nz-layout>
