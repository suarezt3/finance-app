<!-- src/app/features/dashboard/dashboard.component.html -->

<!-- 1. TEMPLATE DEL MENÚ (DRY Principle) -->
<!-- Definimos el menú una sola vez para inyectarlo en el Desktop Sider y en el Mobile Drawer -->
<ng-template #menuItemsTemplate>
  <ul nz-menu nzTheme="dark" nzMode="inline" [nzInlineCollapsed]="isDesktopCollapsed()">

    <li nz-submenu nzOpen nzTitle="Panel Principal" nzIcon="dashboard">
      <ul>
        <!-- Agregamos (click)="closeMobileMenu()" para auto-cerrar el Drawer al navegar en celular -->
        <li nz-menu-item nzMatchRouter (click)="closeMobileMenu()">
          <a routerLink="/dashboard/resumen">Resumen Financiero</a>
        </li>
        <li nz-menu-item nzMatchRouter (click)="closeMobileMenu()">
          <a routerLink="/dashboard/transacciones">Transacciones</a>
        </li>
      </ul>
    </li>

    <li nz-menu-item nzMatchRouter (click)="closeMobileMenu()">
      <a routerLink="/dashboard/configuracion">
        <span nz-icon nzType="setting"></span>
        <span>Configuración</span>
      </a>
    </li>
  </ul>
</ng-template>


<nz-layout class="app-layout">

  <!-- 2. SIDEBAR DESKTOP (Solo visible en pantallas >= 768px) -->
  <nz-sider
    class="desktop-sidebar"
    nzCollapsible
    nzWidth="256px"
    [nzCollapsed]="isDesktopCollapsed()"
    (nzCollapsedChange)="isDesktopCollapsed.set($event)"
    [nzTrigger]="null">

    <div class="sidebar-logo">
      <h1>{{ isDesktopCollapsed() ? 'FA' : 'FinanceApp' }}</h1>
    </div>

    <!-- Renderizamos la plantilla del menú -->
    <ng-container *ngTemplateOutlet="menuItemsTemplate"></ng-container>
  </nz-sider>

  <!-- 3. DRAWER MÓVIL (Menú Off-Canvas para pantallas < 768px) -->
  <nz-drawer
    [nzVisible]="isMobileMenuOpen()"
    nzPlacement="left"
    nzTitle="FinanceApp"
    (nzOnClose)="closeMobileMenu()"
    class="mobile-drawer"
    [nzClosable]="true"
    [nzBodyStyle]="{ padding: '0' }">
    <ng-container *nzDrawerContent>
      <!-- Renderizamos exactamente la misma plantilla del menú -->
      <ng-container *ngTemplateOutlet="menuItemsTemplate"></ng-container>
    </ng-container>
  </nz-drawer>

  <!-- 4. CONTENEDOR PRINCIPAL -->
  <nz-layout>

    <!-- CABECERA (Header) -->
    <nz-header>
      <div class="app-header">

        <!-- Botón Toggle Inteligente (Abre Drawer en Móvil, Colapsa Sider en Desktop) -->
        <span class="header-trigger" (click)="toggleMenu()">
          <span nz-icon [nzType]="getMenuIcon()"></span>
        </span>

        <!-- Acciones de usuario -->
        <div class="header-actions">
          @if (user()) {
            <a nz-dropdown [nzDropdownMenu]="userMenu" class="user-dropdown">
              <nz-avatar
                [nzText]="userInitial()"
                nzSize="default"
                style="background-color: #1890ff;">
              </nz-avatar>

              <!-- Clase 'hide-on-mobile' añadida para ahorrar espacio en la barra superior táctil -->
              <span class="user-name hide-on-mobile">{{ userName() }}</span>
              <span nz-icon nzType="down"></span>
            </a>

            <nz-dropdown-menu #userMenu="nzDropdownMenu">
              <ul nz-menu>
                <li nz-menu-item (click)="openProfile()">
                  <span nz-icon nzType="user"></span> Mi Perfil
                </li>
                <li nz-menu-divider></li>
                <li nz-menu-item nzDanger (click)="onLogout()">
                  <span nz-icon nzType="logout"></span> Cerrar Sesión
                </li>
              </ul>
            </nz-dropdown-menu>
          }
        </div>
      </div>
    </nz-header>

    <!-- ÁREA DE TRABAJO (Content) -->
    <nz-content>
      <div class="inner-content">
        <router-outlet></router-outlet>
      </div>
    </nz-content>

  </nz-layout>

  <!-- MODAL COMPARTIDO -->
  <app-profile-modal></app-profile-modal>
</nz-layout>
