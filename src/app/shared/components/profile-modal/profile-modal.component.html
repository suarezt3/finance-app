<!-- src/app/shared/components/profile-modal/profile-modal.component.html -->
<nz-modal
  [nzVisible]="isVisible()"
  nzTitle="Configuración de Perfil y Seguridad"
  (nzOnCancel)="closeModal()"
  [nzFooter]="null"
  nzWidth="520px"
  class="enterprise-profile-modal"
>
  <ng-container *nzModalContent>
    <nz-tabs class="enterprise-modal-tabs">

      <!-- PESTAÑA 1: DATOS PERSONALES -->
      <nz-tab nzTitle="Datos Personales">
        <form nz-form [formGroup]="profileForm" (ngSubmit)="updateProfile()" nzLayout="vertical" class="profile-form">
          <nz-form-item>
            <nz-form-label nzRequired nzFor="fullName">Nombre Completo</nz-form-label>
            <nz-form-control nzErrorTip="Por favor ingresa un nombre válido (mín. 3 caracteres).">
              <nz-input-wrapper class="full-width">
                <span nz-icon nzType="user" nzInputPrefix class="input-prefix-icon"></span>
                <input type="text" nz-input formControlName="fullName" id="fullName" placeholder="Ej. Roberto Gómez" nzSize="large" />
              </nz-input-wrapper>
            </nz-form-control>
          </nz-form-item>

          <div class="modal-footer-actions">
            <button nz-button type="button" (click)="closeModal()" class="btn-cancel">Cancelar</button>
            <button nz-button nzType="primary" type="submit" [nzLoading]="isSavingProfile()" class="btn-save-profile">
              Guardar Cambios
            </button>
          </div>
        </form>
      </nz-tab>

      <!-- PESTAÑA 2: SEGURIDAD (CONTRASEÑA) -->
      <nz-tab nzTitle="Seguridad & Acceso">
        <form nz-form [formGroup]="securityForm" (ngSubmit)="updatePassword()" nzLayout="vertical" class="profile-form">

          <nz-form-item>
            <nz-form-label nzRequired nzFor="newPassword">Nueva Contraseña</nz-form-label>
            <nz-form-control nzErrorTip="Debe contener al menos 8 caracteres, una mayúscula, una minúscula y un carácter especial.">
              <nz-input-password nzSize="large" class="full-width">
                <span nz-icon nzType="lock" nzInputPrefix class="input-prefix-icon"></span>
                <input
                  [type]="passVisible() ? 'text' : 'password'"
                  nz-input
                  formControlName="newPassword"
                  id="newPassword"
                  placeholder="Mínimo 8 caracteres"
                  nzSize="large" />
              </nz-input-password>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label nzRequired nzFor="confirmPassword">Confirmar Contraseña</nz-form-label>
            <nz-form-control [nzErrorTip]="passwordErrorTpl">
              <nz-input-password nzSize="large" class="full-width">
                <span nz-icon nzType="lock" nzInputPrefix class="input-prefix-icon"></span>
                <input
                  [type]="confirmVisible() ? 'text' : 'password'"
                  nz-input
                  formControlName="confirmPassword"
                  id="confirmPassword"
                  placeholder="Repite la nueva contraseña"
                  nzSize="large" />
              </nz-input-password>

              <ng-template #passwordErrorTpl let-control>
                @if (securityForm.get('confirmPassword')?.hasError('passwordMismatch')) {
                  <span>Las contraseñas no coinciden.</span>
                } @else {
                  <span>Por favor confirma tu contraseña.</span>
                }
              </ng-template>
            </nz-form-control>
          </nz-form-item>

          <div class="modal-footer-actions">
            <button nz-button type="button" (click)="closeModal()" class="btn-cancel">Cancelar</button>
            <button nz-button nzType="primary" nzDanger type="submit" [nzLoading]="isSavingPassword()" class="btn-update-password">
              Actualizar Contraseña
            </button>
          </div>
        </form>
      </nz-tab>

    </nz-tabs>
  </ng-container>
</nz-modal>
