<!-- src/app/shared/components/transaction-modal/transaction-modal.component.html -->
<nz-modal
  [nzVisible]="isVisible()"
  [nzTitle]="transactionToEdit() ? 'Editar Transacción' : 'Registrar Nueva Transacción'"
  (nzOnCancel)="onCancel()"
  (nzOnOk)="onSubmit()"
  [nzOkLoading]="isSubmitting()"
  nzOkText="Guardar"
  nzCancelText="Cancelar"
>
  <ng-container *nzModalContent>
    <form nz-form [formGroup]="transactionForm" nzLayout="vertical">

      <!-- Tipo de Transacción -->
      <nz-form-item>
        <nz-form-label nzRequired>Tipo</nz-form-label>
        <nz-form-control nzErrorTip="Seleccione el tipo de transacción">
          <nz-select formControlName="type">
            <nz-option nzValue="EXPENSE" nzLabel="Gasto"></nz-option>
            <nz-option nzValue="INCOME" nzLabel="Ingreso"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <!-- Monto -->
      <nz-form-item>
        <nz-form-label nzRequired>Monto a registrar</nz-form-label>
        <nz-form-control nzErrorTip="Ingrese un monto válido mayor a 0">
          <nz-input-number
            formControlName="amount"
            [nzMin]="0.01"
            [nzStep]="1000"
            style="width: 100%;"
            [nzPrecision]="2"
          ></nz-input-number>
        </nz-form-control>
      </nz-form-item>

      <!-- Fecha -->
      <nz-form-item>
        <nz-form-label nzRequired>Fecha de transacción</nz-form-label>
        <nz-form-control nzErrorTip="Seleccione una fecha válida">
          <nz-date-picker formControlName="date" style="width: 100%;"></nz-date-picker>
        </nz-form-control>
      </nz-form-item>

      <!-- Categoría (Filtrada reactivamente) -->
      <nz-form-item>
        <nz-form-label>Categoría</nz-form-label>
        <nz-form-control>
          <nz-select formControlName="category_id" nzPlaceHolder="Seleccione una categoría..." nzAllowClear>
            @for (category of filteredCategories(); track category.id) {
              <nz-option [nzValue]="category.id" [nzLabel]="category.name"></nz-option>
            }
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <!-- Método de Pago -->
      <nz-form-item>
        <nz-form-label>Método de Pago</nz-form-label>
        <nz-form-control>
          <nz-select formControlName="payment_method_id" nzPlaceHolder="Seleccione un método de pago..." nzAllowClear>
            @for (method of paymentMethods(); track method.id) {
              <nz-option [nzValue]="method.id" [nzLabel]="method.name"></nz-option>
            }
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <!-- Descripción Opcional -->
      <nz-form-item>
        <nz-form-label>Descripción (Opcional)</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="description" placeholder="Ej. Compra de suministros, pago de cliente..." />
        </nz-form-control>
      </nz-form-item>

    </form>
  </ng-container>
</nz-modal>
