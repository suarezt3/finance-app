<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de Fondo: Midnight Obsidian Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="50%" stop-color="#0b1736"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>

    <!-- Resplandor Ambiental Superior -->
    <radialGradient id="ambientGlow" cx="50%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050a18" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente Esmeralda Neón de Crecimiento -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Gradiente Azul Zafiro Financiero -->
    <linearGradient id="sapphireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Gradiente Oro Champagne -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Bisel Metálico Exterior -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#64748b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Sombra Suave -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563eb" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fondo Cuadrado con Esquinas Suaves (Squircle) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="115" fill="url(#ambientGlow)"/>

  <!-- Anillo Sutil de Borde Superior -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="url(#rimGrad)" stroke-width="3" opacity="0.6"/>

  <!-- GRUPO PRINCIPAL CON SOMBRA -->
  <g filter="url(#softGlow)">
    
    <!-- ESCUDO / BÓVEDA HEXAGONAL BASE (Facetas de Seguridad Financiera) -->
    <!-- Ala Izquierda Zafiro -->
    <path d="M 256,92 L 138,158 L 138,300 L 256,366 Z" fill="url(#sapphireGrad)" opacity="0.95"/>
    
    <!-- Ala Derecha Azul Profundo con Sombra Interna -->
    <path d="M 256,92 L 374,158 L 374,300 L 256,366 Z" fill="#1e3a8a" opacity="0.85"/>

    <!-- Bisel Superior Iluminado -->
    <path d="M 256,92 L 374,158 L 340,175 L 256,128 L 172,175 L 138,158 Z" fill="#93c5fd" opacity="0.45"/>

    <!-- NÚCLEO FINANCIERO DINÁMICO: FLECHA DE CRECIMIENTO & MONOGRAMA 'F' / DIAMANTE -->
    <!-- Chevron Ascendente Esmeralda (Crecimiento de Patrimonio) -->
    <path d="M 256,150 L 330,225 L 285,225 L 256,196 L 227,225 L 182,225 Z" fill="url(#emeraldGrad)"/>

    <!-- Barra de Equilibrio Oro / Champagne -->
    <path d="M 215,248 L 297,248 L 285,274 L 227,274 Z" fill="url(#goldGrad)"/>

    <!-- Pilar Central de Liquidez y Riqueza (Forma de diamante / lingote) -->
    <polygon points="256,225 290,285 256,345 222,285" fill="url(#emeraldGrad)"/>

    <!-- Destello Central de Éxito Financiero -->
    <circle cx="256" cy="285" r="14" fill="#ffffff" opacity="0.95"/>
    <circle cx="256" cy="285" r="28" fill="#34d399" opacity="0.35"/>

    <!-- Líneas de Inversión y Trayectoria Neón -->
    <path d="M 175,320 L 256,366 L 337,320" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Puntos de Conexión de Cuentas (Nequi, Bancos, Billeteras) -->
    <circle cx="175" cy="320" r="5" fill="#38bdf8"/>
    <circle cx="337" cy="320" r="5" fill="#34d399"/>
    <circle cx="256" cy="366" r="6" fill="#fbbf24"/>
  </g>
</svg>
